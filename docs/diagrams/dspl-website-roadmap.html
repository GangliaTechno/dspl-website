<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DSPL Website Roadmap</title>
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@500;600&family=Instrument+Serif:ital@0;1&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #f7f4ed;
      --surface: #fff7e6;
      --white: #fffdf8;
      --ink: #171a22;
      --muted: #5e5b55;
      --line: #c9c3b7;
      --soft-line: #ded8cc;
      --accent: #e6a000;
      --accent-text: #8a5b00;
      --serif: "Instrument Serif", Georgia, serif;
      --sans: "Outfit", system-ui, sans-serif;
      --mono: "Geist Mono", ui-monospace, monospace;
    }

    * { box-sizing: border-box; }

    html { background: var(--paper); }

    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      color: var(--ink);
      background:
        radial-gradient(circle at 78% 8%, rgba(230, 160, 0, 0.08), transparent 22rem),
        var(--paper);
      font-family: var(--sans);
    }

    .frame {
      width: min(1720px, calc(100vw - 64px));
      margin: 0 auto;
      padding: 52px 0 40px;
    }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--accent-text);
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 920px;
      margin: 0;
      font-family: var(--serif);
      font-size: clamp(48px, 6vw, 84px);
      font-weight: 400;
      letter-spacing: -0.035em;
      line-height: 0.96;
    }

    .subtitle {
      max-width: 820px;
      margin: 20px 0 32px;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.55;
    }

    .subtitle strong {
      color: var(--ink);
      font-weight: 600;
    }

    .diagram-shell {
      width: 100%;
      min-width: 0;
      max-width: 100%;
      overflow: hidden;
      border: 1px solid var(--soft-line);
      border-radius: 24px;
      background: rgba(255, 253, 248, 0.72);
      box-shadow: 0 28px 72px rgba(23, 26, 34, 0.08);
    }

    .diagram-scroll {
      width: 100%;
      min-width: 0;
      max-width: 100%;
      overflow-x: auto;
      overscroll-behavior-inline: contain;
      scrollbar-color: var(--line) transparent;
    }

    svg {
      display: block;
      width: 100%;
      min-width: 1120px;
      height: auto;
    }

    .status-band { fill: #f2eee5; }
    .status-band.current { fill: #fff4d2; }
    .status-band.later { fill: #f5f2eb; }
    .status-rule { stroke: var(--line); stroke-width: 2; }
    .status-boundary { stroke: var(--soft-line); stroke-width: 1.5; stroke-dasharray: 4 8; }
    .connector { stroke: #9e988d; stroke-width: 2; }
    .connector.current { stroke: var(--accent); stroke-width: 3; }
    .axis { stroke: var(--ink); stroke-width: 3; stroke-linecap: round; }
    .axis-muted { stroke: #9e988d; stroke-width: 3; stroke-linecap: round; stroke-dasharray: 7 10; }

    .stage-label {
      fill: var(--muted);
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.11em;
    }

    .stage-caption {
      fill: #777269;
      font-family: var(--sans);
      font-size: 13px;
    }

    .card {
      fill: var(--white);
      stroke: var(--soft-line);
      stroke-width: 1.5;
    }

    .card.done { fill: #fffdf8; }
    .card.next { fill: var(--surface); }
    .card.later { fill: #f5f2eb; stroke-dasharray: 6 6; }
    .card.current { fill: #fff8e5; stroke: var(--accent); stroke-width: 3; }

    .card-kicker {
      fill: #777269;
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
    }

    .card-kicker.current { fill: var(--accent-text); }

    .card-title {
      fill: var(--ink);
      font-family: var(--sans);
      font-size: 16px;
      font-weight: 600;
    }

    .card-copy {
      fill: var(--muted);
      font-family: var(--sans);
      font-size: 13px;
      font-weight: 400;
    }

    .card-meta {
      fill: var(--accent-text);
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 600;
    }

    .point-done { fill: var(--ink); }
    .point-next { fill: var(--white); stroke: var(--ink); stroke-width: 3; }
    .point-later { fill: var(--paper); stroke: var(--muted); stroke-width: 2.5; stroke-dasharray: 4 3; }
    .check { fill: none; stroke: var(--white); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .current-halo { fill: rgba(230, 160, 0, 0.18); }
    .current-dot { fill: var(--accent); stroke: var(--ink); stroke-width: 2; }
    .current-flag { fill: var(--accent); }

    .legend-label {
      fill: var(--muted);
      font-family: var(--sans);
      font-size: 13px;
    }

    .mobile-break { display: none; }

    .scroll-hint {
      display: none;
      margin: 0;
      padding: 12px 16px;
      border-top: 1px solid var(--soft-line);
      color: var(--muted);
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.04em;
      text-align: center;
    }

    @media (max-width: 720px) {
      .frame {
        width: calc(100vw - 40px);
        min-width: 0;
        max-width: calc(100vw - 40px);
        padding: 32px 0 24px;
      }

      h1 {
        max-width: 100%;
        font-size: 44px;
        overflow-wrap: break-word;
      }

      .subtitle {
        max-width: 100%;
        margin-top: 16px;
        font-size: 15px;
      }

      .mobile-break { display: inline; }
      .diagram-shell { border-radius: 18px; }
      svg { min-width: 1040px; }
      .scroll-hint { display: block; }
    }
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">DSPL website · release view</p>
    <h1>From finished foundations<span class="mobile-break"><br></span> to an approved launch.</h1>
    <p class="subtitle">
      This is a <strong>status roadmap, not a dated schedule.</strong> It shows what is complete, where the release candidate stands now, which gates come next, and what continues after launch.
    </p>

    <section class="diagram-shell" aria-label="Scrollable DSPL website status roadmap">
      <div class="diagram-scroll" tabindex="0" aria-label="Scroll horizontally to explore all roadmap milestones">
        <svg viewBox="0 0 1600 760" role="img" aria-labelledby="dspl-website-roadmap-title dspl-website-roadmap-desc" xmlns="http://www.w3.org/2000/svg">
          <title id="dspl-website-roadmap-title">DSPL website Done, Current, Next, and Later roadmap</title>
          <desc id="dspl-website-roadmap-desc">Nine status milestones show four completed website phases, the current release candidate, three release gates that come next, and ongoing post-launch operations. The horizontal direction indicates status progression, not calendar time.</desc>

          <rect width="1600" height="760" fill="#f7f4ed"/>

          <g aria-hidden="true">
            <rect class="status-band" x="80" y="72" width="640" height="64" rx="12"/>
            <rect class="status-band current" x="720" y="72" width="200" height="64" rx="12"/>
            <rect class="status-band" x="920" y="72" width="480" height="64" rx="12"/>
            <rect class="status-band later" x="1400" y="72" width="120" height="64" rx="12"/>
            <line class="status-boundary" x1="720" y1="144" x2="720" y2="628"/>
            <line class="status-boundary" x1="920" y1="144" x2="920" y2="628"/>
            <line class="status-boundary" x1="1400" y1="144" x2="1400" y2="628"/>

            <text class="stage-label" x="104" y="99">DONE</text>
            <text class="stage-caption" x="104" y="120">Built and verified</text>
            <text class="stage-label" x="744" y="99">CURRENT</text>
            <text class="stage-caption" x="744" y="120">Release candidate</text>
            <text class="stage-label" x="944" y="99">NEXT</text>
            <text class="stage-caption" x="944" y="120">Approval and release gates</text>
            <text class="stage-label" x="1424" y="99">LATER</text>
            <text class="stage-caption" x="1424" y="120">Operate</text>

            <line class="axis" x1="80" y1="380" x2="1400" y2="380"/>
            <line class="axis-muted" x1="1400" y1="380" x2="1520" y2="380"/>
          </g>

          <g class="milestone" data-milestone="1" aria-label="Done: Foundations complete">
            <line class="connector" x1="120" y1="300" x2="120" y2="370"/>
            <rect class="card done" x="10" y="168" width="220" height="132" rx="14"/>
            <text class="card-kicker" x="30" y="193">01 · DONE</text>
            <text class="card-title" x="30" y="219">Foundations complete</text>
            <text class="card-copy" x="30" y="245">
              <tspan x="30" dy="0">Analytics · accessibility</tspan>
              <tspan x="30" dy="19">SEO · forms and privacy</tspan>
              <tspan x="30" dy="19">Tests · lazy routes</tspan>
            </text>
            <circle class="point-done" cx="120" cy="380" r="8"/>
            <path class="check" d="M116 380l3 3 6-7"/>
          </g>

          <g class="milestone" data-milestone="2" aria-label="Done: Evidence-led redesign complete">
            <line class="connector" x1="280" y1="390" x2="280" y2="460"/>
            <rect class="card done" x="170" y="460" width="220" height="132" rx="14"/>
            <text class="card-kicker" x="190" y="485">02 · DONE</text>
            <text class="card-title" x="190" y="511">Evidence-led redesign</text>
            <text class="card-copy" x="190" y="537">
              <tspan x="190" dy="0">Responsive heroes · proof</tspan>
              <tspan x="190" dy="19">Route imagery · conversion</tspan>
              <tspan x="190" dy="19">Visual tokens</tspan>
            </text>
            <circle class="point-done" cx="280" cy="380" r="8"/>
            <path class="check" d="M276 380l3 3 6-7"/>
          </g>

          <g class="milestone" data-milestone="3" aria-label="Done: Launch hardening complete">
            <line class="connector" x1="440" y1="300" x2="440" y2="370"/>
            <rect class="card done" x="330" y="168" width="220" height="132" rx="14"/>
            <text class="card-kicker" x="350" y="193">03 · DONE</text>
            <text class="card-title" x="350" y="219">Launch hardening</text>
            <text class="card-copy" x="350" y="245">
              <tspan x="350" dy="0">Prerender · 404 · metadata</tspan>
              <tspan x="350" dy="19">Headers · focus and keyboard</tspan>
              <tspan x="350" dy="19">No public source maps</tspan>
            </text>
            <circle class="point-done" cx="440" cy="380" r="8"/>
            <path class="check" d="M436 380l3 3 6-7"/>
          </g>

          <g class="milestone" data-milestone="4" aria-label="Done: Production polish complete">
            <line class="connector" x1="600" y1="390" x2="600" y2="460"/>
            <rect class="card done" x="490" y="460" width="220" height="132" rx="14"/>
            <text class="card-kicker" x="510" y="485">04 · DONE</text>
            <text class="card-title" x="510" y="511">Production polish</text>
            <text class="card-copy" x="510" y="537">
              <tspan x="510" dy="0">Blogs · Sanity snapshot</tspan>
              <tspan x="510" dy="19">Umami + GA4 · homepage</tspan>
              <tspan x="510" dy="19">Header · performance</tspan>
            </text>
            <circle class="point-done" cx="600" cy="380" r="8"/>
            <path class="check" d="M596 380l3 3 6-7"/>
          </g>

          <g class="milestone" data-milestone="5" aria-label="Current: Release candidate">
            <line class="connector current" x1="820" y1="288" x2="820" y2="365"/>
            <rect class="card current" data-focal="true" x="690" y="132" width="260" height="156" rx="16"/>
            <text class="card-kicker current" x="714" y="159">05 · CURRENT</text>
            <text class="card-title" x="714" y="187">Release candidate</text>
            <text class="card-meta" x="714" y="211">release/v1.0-production</text>
            <text class="card-copy" x="714" y="237">
              <tspan x="714" dy="0">38 files · 216 tests pass</tspan>
              <tspan x="714" dy="19">Final gate + approval open</tspan>
            </text>
            <g class="current-marker" data-focal="true">
              <circle class="current-halo" cx="820" cy="380" r="18"/>
              <circle class="current-dot" cx="820" cy="380" r="9"/>
              <path class="current-flag" d="M820 349l-8-11h16z"/>
            </g>
          </g>

          <g class="milestone" data-milestone="6" aria-label="Next: Credential and evidence gate">
            <line class="connector" x1="1020" y1="390" x2="1020" y2="460"/>
            <rect class="card next" x="910" y="460" width="220" height="132" rx="14"/>
            <text class="card-kicker" x="930" y="485">06 · NEXT</text>
            <text class="card-title" x="930" y="511">Credential + gate</text>
            <text class="card-copy" x="930" y="537">
              <tspan x="930" dy="0">Rotate Web3Forms key</tspan>
              <tspan x="930" dy="19">Lint · test · build · HTML</tspan>
              <tspan x="930" dy="19">Audit · maps · browser QA</tspan>
            </text>
            <circle class="point-next" cx="1020" cy="380" r="8"/>
          </g>

          <g class="milestone" data-milestone="7" aria-label="Next: Review and merge">
            <line class="connector" x1="1180" y1="300" x2="1180" y2="370"/>
            <rect class="card next" x="1070" y="168" width="220" height="132" rx="14"/>
            <text class="card-kicker" x="1090" y="193">07 · NEXT</text>
            <text class="card-title" x="1090" y="219">Review + merge</text>
            <text class="card-copy" x="1090" y="245">
              <tspan x="1090" dy="0">Final approval · PR review</tspan>
              <tspan x="1090" dy="19">Merge into main</tspan>
              <tspan x="1090" dy="19">Not deployment permission</tspan>
            </text>
            <circle class="point-next" cx="1180" cy="380" r="8"/>
          </g>

          <g class="milestone" data-milestone="8" aria-label="Next: Approved deployment">
            <line class="connector" x1="1340" y1="390" x2="1340" y2="460"/>
            <rect class="card next" x="1230" y="460" width="220" height="132" rx="14"/>
            <text class="card-kicker" x="1250" y="485">08 · NEXT</text>
            <text class="card-title" x="1250" y="511">Approved deployment</text>
            <text class="card-copy" x="1250" y="537">
              <tspan x="1250" dy="0">Separate release decision</tspan>
              <tspan x="1250" dy="19">Deploy generated static site</tspan>
              <tspan x="1250" dy="19">No implicit release</tspan>
            </text>
            <circle class="point-next" cx="1340" cy="380" r="8"/>
          </g>

          <g class="milestone" data-milestone="9" aria-label="Later: Operate and keep current">
            <line class="connector" x1="1460" y1="300" x2="1460" y2="370" stroke-dasharray="5 6"/>
            <rect class="card later" x="1350" y="168" width="220" height="132" rx="14"/>
            <text class="card-kicker" x="1370" y="193">09 · LATER</text>
            <text class="card-title" x="1370" y="219">Operate + sync</text>
            <text class="card-copy" x="1370" y="245">
              <tspan x="1370" dy="0">Production smoke tests</tspan>
              <tspan x="1370" dy="19">Forms · analytics · SEO</tspan>
              <tspan x="1370" dy="19">Keep roadmap/docs current</tspan>
            </text>
            <circle class="point-later" cx="1460" cy="380" r="8"/>
          </g>

          <g aria-hidden="true">
            <line class="status-rule" x1="80" y1="652" x2="1520" y2="652"/>
            <circle class="point-done" cx="104" cy="694" r="7"/>
            <path class="check" d="M100 694l3 3 6-7"/>
            <text class="legend-label" x="122" y="699">Verified complete</text>

            <circle class="point-next" cx="312" cy="694" r="7"/>
            <text class="legend-label" x="330" y="699">Open gate</text>

            <circle class="point-later" cx="450" cy="694" r="7"/>
            <text class="legend-label" x="468" y="699">Ongoing operation</text>

            <text class="stage-label" x="1518" y="699" text-anchor="end">STATUS PROGRESSION →</text>
          </g>
        </svg>
      </div>
      <p class="scroll-hint">Swipe horizontally to view the full roadmap →</p>
    </section>
  </main>
</body>
</html>
