<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DSPL Website: Content to Visitor</title>
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --paper: #F7F4ED;
      --paper-2: #FFF7E6;
      --ink: #171A22;
      --muted: #5E5B55;
      --soft: #8A857B;
      --rule: rgba(23, 26, 34, 0.14);
      --accent: #E6A000;
      --accent-dark: #8A5B00;
      --font-sans: 'Outfit', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', Georgia, serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
    }

    body {
      min-height: 100vh;
      padding: 48px 32px;
      color: var(--ink);
      background: var(--paper);
      font-family: var(--font-sans);
      overflow-x: hidden;
    }

    .frame {
      width: 100%;
      min-width: 0;
      max-width: 1440px;
      margin: 0 auto;
    }

    .eyebrow {
      margin-bottom: 8px;
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 100%;
      margin-bottom: 12px;
      color: var(--ink);
      font-family: var(--font-serif);
      font-size: 40px;
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1;
      overflow-wrap: anywhere;
    }

    .subtitle {
      max-width: 720px;
      margin-bottom: 32px;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .mobile-break { display: none; }

    .diagram-scroll {
      width: 100%;
      max-width: 100%;
      min-width: 0;
      overflow-x: auto;
      padding-bottom: 8px;
    }

    svg {
      display: block;
      width: 100%;
      min-width: 1120px;
      height: auto;
    }

    .zone {
      fill: rgba(23, 26, 34, 0.025);
      stroke: rgba(23, 26, 34, 0.14);
      stroke-width: 1;
    }

    .zone-label {
      fill: var(--muted);
      font-family: var(--font-mono);
      font-size: 8px;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-anchor: middle;
    }

    .zone-note {
      fill: var(--soft);
      font-family: var(--font-mono);
      font-size: 8px;
      letter-spacing: 0.08em;
      text-anchor: end;
    }

    .connector {
      fill: none;
      stroke: var(--muted);
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.2;
    }

    .connector.secondary {
      stroke: var(--accent-dark);
      stroke-dasharray: 4 3;
      stroke-width: 1;
    }

    .connector-label-mask {
      fill: var(--paper);
    }

    .connector-label {
      fill: var(--muted);
      font-family: var(--font-mono);
      font-size: 8px;
      letter-spacing: 0.06em;
      text-anchor: middle;
    }

    .connector-label.secondary {
      fill: var(--accent-dark);
    }

    .node-mask {
      fill: var(--paper);
    }

    .node-box {
      stroke-width: 1;
    }

    .node-input .node-box {
      fill: rgba(94, 91, 85, 0.08);
      stroke: var(--soft);
    }

    .node-backend .node-box {
      fill: #FFFDF8;
      stroke: var(--ink);
    }

    .node-store .node-box {
      fill: rgba(23, 26, 34, 0.05);
      stroke: var(--muted);
    }

    .node-focal .node-box {
      fill: rgba(230, 160, 0, 0.12);
      stroke: var(--accent);
      stroke-width: 1.2;
    }

    .node-external .node-box {
      fill: rgba(23, 26, 34, 0.03);
      stroke: rgba(23, 26, 34, 0.42);
      stroke-dasharray: 4 3;
    }

    .node-tag-box {
      fill: transparent;
      stroke: rgba(23, 26, 34, 0.38);
      stroke-width: 1;
    }

    .node-focal .node-tag-box {
      stroke: rgba(138, 91, 0, 0.62);
    }

    .node-tag {
      fill: var(--muted);
      font-family: var(--font-mono);
      font-size: 8px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-anchor: middle;
    }

    .node-focal .node-tag {
      fill: var(--accent-dark);
    }

    .node-name {
      fill: var(--ink);
      font-family: var(--font-sans);
      font-size: 12px;
      font-weight: 600;
      text-anchor: middle;
    }

    .node-tech {
      fill: var(--muted);
      font-family: var(--font-mono);
      font-size: 8px;
      text-anchor: middle;
    }

    .node-focal .node-tech {
      fill: var(--accent-dark);
    }

    .legend-rule {
      stroke: rgba(23, 26, 34, 0.16);
      stroke-width: 1;
    }

    .legend-line {
      fill: none;
      stroke: var(--muted);
      stroke-linecap: round;
      stroke-width: 1.2;
    }

    .legend-line.secondary {
      stroke: var(--accent-dark);
      stroke-dasharray: 4 3;
      stroke-width: 1;
    }

    .legend-label {
      fill: var(--muted);
      font-family: var(--font-mono);
      font-size: 8px;
      letter-spacing: 0.08em;
    }

    .legend-focal {
      fill: rgba(230, 160, 0, 0.12);
      stroke: var(--accent);
      stroke-width: 1;
    }

    @media (max-width: 720px) {
      body { padding: 32px 20px; }
      .frame { width: calc(100vw - 40px); max-width: calc(100vw - 40px); }
      h1 { width: 100%; max-width: 100%; font-size: 32px; }
      .subtitle { width: 100%; max-width: 100%; font-size: 12px; }
      .mobile-break { display: block; }
    }
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">Architecture · DSPL Website</p>
    <h1>DSPL Website: Content to<span class="mobile-break"><br></span> Visitor</h1>
    <p class="subtitle">How content, route metadata, prerendering,<span class="mobile-break"><br></span> static hosting, and selective hydration<span class="mobile-break"><br></span> become the public website experience.</p>

    <div class="diagram-scroll">
      <svg viewBox="0 0 1440 784" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dspl-content-to-visitor-title dspl-content-to-visitor-desc">
        <title id="dspl-content-to-visitor-title">DSPL website content to visitor architecture</title>
        <desc id="dspl-content-to-visitor-desc">Architecture showing DSPL content and route metadata moving through synchronization, Vite prerendering, static delivery, browser hydration, and the shared React site experience.</desc>

        <defs>
          <marker id="dspl-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#5E5B55"/>
          </marker>
          <marker id="dspl-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#E6A000"/>
          </marker>
          <marker id="dspl-arrow-secondary" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#8A5B00"/>
          </marker>
        </defs>

        <rect width="100%" height="100%" fill="#F7F4ED"/>

        <g transform="translate(0 -96)">
        <!-- Zones are painted before connectors and nodes. -->
        <rect class="zone" x="40" y="152" width="400" height="596" rx="8"/>
        <rect x="176" y="156" width="128" height="12" rx="2" fill="#F7F4ED"/>
        <text class="zone-label" x="240" y="165">CONTENT + BUILD INPUTS</text>

        <rect class="zone" x="464" y="152" width="560" height="596" rx="8"/>
        <rect x="652" y="156" width="184" height="12" rx="2" fill="#F7F4ED"/>
        <text class="zone-label" x="744" y="165">APPLICATION + DELIVERY</text>
        <text class="zone-note" x="1000" y="205">STATIC HOST / CDN</text>

        <rect class="zone" x="1048" y="152" width="352" height="596" rx="8"/>
        <rect x="1152" y="156" width="160" height="12" rx="2" fill="#F7F4ED"/>
        <text class="zone-label" x="1232" y="165">RUNTIME EXPERIENCE</text>

        <!-- Solid primary flow. Connectors are painted before node boxes. -->
        <path class="connector" d="M232 296 H264" marker-end="url(#dspl-arrow)"/>
        <path class="connector" d="M424 296 H496" marker-end="url(#dspl-arrow)"/>
        <path class="connector" d="M696 296 H744" marker-end="url(#dspl-arrow)"/>
        <path class="connector" d="M844 332 V420" marker-end="url(#dspl-arrow-accent)"/>
        <path class="connector" d="M944 456 H1056" marker-end="url(#dspl-arrow)"/>
        <path class="connector" d="M1136 492 V580" marker-end="url(#dspl-arrow-accent)"/>
        <path class="connector" d="M1216 616 H1232" marker-end="url(#dspl-arrow)"/>

        <!-- Secondary flow: separate bottom route avoids the primary connector. -->
        <path class="connector secondary" d="M344 332 V356 Q344 364 352 364 H588 Q596 364 596 356 V332" marker-end="url(#dspl-arrow-secondary)"/>
        <rect class="connector-label-mask" x="424" y="332" width="92" height="12" rx="2"/>
        <text class="connector-label secondary" x="470" y="341">PUBLISHED PATHS</text>

        <path class="connector secondary" d="M1136 580 V536 Q1136 528 1144 528 H1216 Q1224 528 1224 520 V440 Q1224 432 1232 432" marker-end="url(#dspl-arrow-secondary)"/>
        <rect class="connector-label-mask" x="1144" y="496" width="72" height="12" rx="2"/>
        <text class="connector-label secondary" x="1180" y="505">TRACK / SUBMIT</text>

        <!-- Labels sit on open connector segments, with paper masks and visible gaps. -->
        <rect class="connector-label-mask" x="756" y="368" width="72" height="12" rx="2"/>
        <text class="connector-label" x="792" y="377">PRERENDER</text>
        <rect class="connector-label-mask" x="976" y="424" width="48" height="12" rx="2"/>
        <text class="connector-label" x="1000" y="433">HTML</text>

        <!-- Node: content sources. -->
        <g class="node node-input">
          <rect class="node-mask" x="72" y="260" width="160" height="72" rx="6"/>
          <rect class="node-box" x="72" y="260" width="160" height="72" rx="6"/>
          <rect class="node-tag-box" x="84" y="272" width="56" height="16" rx="2"/>
          <text class="node-tag" x="112" y="283">INPUT</text>
          <text class="node-name" x="152" y="308">Content sources</text>
          <text class="node-tech" x="152" y="324">Sanity + fallback</text>
        </g>

        <!-- Node: content sync. -->
        <g class="node node-store">
          <rect class="node-mask" x="264" y="260" width="160" height="72" rx="6"/>
          <rect class="node-box" x="264" y="260" width="160" height="72" rx="6"/>
          <rect class="node-tag-box" x="276" y="272" width="64" height="16" rx="2"/>
          <text class="node-tag" x="308" y="283">STORE</text>
          <text class="node-name" x="344" y="308">Content sync</text>
          <text class="node-tech" x="344" y="324">manifest + article JSON</text>
        </g>

        <!-- Node: route and SEO core. -->
        <g class="node node-backend">
          <rect class="node-mask" x="496" y="260" width="200" height="72" rx="6"/>
          <rect class="node-box" x="496" y="260" width="200" height="72" rx="6"/>
          <rect class="node-tag-box" x="508" y="272" width="64" height="16" rx="2"/>
          <text class="node-tag" x="540" y="283">ROUTES</text>
          <text class="node-name" x="596" y="308">Route + SEO core</text>
          <text class="node-tech" x="596" y="324">AppRoutes · 14 patterns</text>
        </g>

        <!-- Node: build and prerender focal. -->
        <g class="node node-focal">
          <rect class="node-mask" x="744" y="260" width="200" height="72" rx="6"/>
          <rect class="node-box" x="744" y="260" width="200" height="72" rx="6"/>
          <rect class="node-tag-box" x="756" y="272" width="56" height="16" rx="2"/>
          <text class="node-tag" x="784" y="283">BUILD</text>
          <text class="node-name" x="844" y="308">Build + prerender</text>
          <text class="node-tech" x="844" y="324">Vite · sitemap · HTML</text>
        </g>

        <!-- Node: static output. -->
        <g class="node node-store">
          <rect class="node-mask" x="744" y="420" width="200" height="72" rx="6"/>
          <rect class="node-box" x="744" y="420" width="200" height="72" rx="6"/>
          <rect class="node-tag-box" x="756" y="432" width="64" height="16" rx="2"/>
          <text class="node-tag" x="788" y="443">OUTPUT</text>
          <text class="node-name" x="844" y="468">Static output</text>
          <text class="node-tech" x="844" y="484">dist · 404 · policies</text>
        </g>

        <!-- Node: browser bootstrap focal. -->
        <g class="node node-focal">
          <rect class="node-mask" x="1056" y="420" width="160" height="72" rx="6"/>
          <rect class="node-box" x="1056" y="420" width="160" height="72" rx="6"/>
          <rect class="node-tag-box" x="1068" y="432" width="56" height="16" rx="2"/>
          <text class="node-tag" x="1096" y="443">CLIENT</text>
          <text class="node-name" x="1136" y="468">Browser bootstrap</text>
          <text class="node-tech" x="1136" y="484">hydrate known · render unknown</text>
        </g>

        <!-- Node: shared shell and pages. -->
        <g class="node node-backend">
          <rect class="node-mask" x="1056" y="580" width="160" height="72" rx="6"/>
          <rect class="node-box" x="1056" y="580" width="160" height="72" rx="6"/>
          <rect class="node-tag-box" x="1068" y="592" width="48" height="16" rx="2"/>
          <text class="node-tag" x="1092" y="603">APP</text>
          <text class="node-name" x="1136" y="628">Site shell + pages</text>
          <text class="node-tech" x="1136" y="644">Header · Footer · lazy routes</text>
        </g>

        <!-- Node: visitor. -->
        <g class="node node-external">
          <rect class="node-mask" x="1232" y="580" width="160" height="72" rx="6"/>
          <rect class="node-box" x="1232" y="580" width="160" height="72" rx="6"/>
          <rect class="node-tag-box" x="1244" y="592" width="72" height="16" rx="2"/>
          <text class="node-tag" x="1280" y="603">AUDIENCE</text>
          <text class="node-name" x="1312" y="628">Visitor</text>
          <text class="node-tech" x="1312" y="644">public browser experience</text>
        </g>

        <!-- Node: browser integrations. -->
        <g class="node node-external">
          <rect class="node-mask" x="1232" y="360" width="160" height="72" rx="6"/>
          <rect class="node-box" x="1232" y="360" width="160" height="72" rx="6"/>
          <rect class="node-tag-box" x="1244" y="372" width="72" height="16" rx="2"/>
          <text class="node-tag" x="1280" y="383">EXTERNAL</text>
          <text class="node-name" x="1312" y="408">Browser integrations</text>
          <text class="node-tech" x="1312" y="424">Umami · GA4 · Web3Forms</text>
        </g>

        <!-- Bottom legend strip. -->
        <line class="legend-rule" x1="40" y1="780" x2="1400" y2="780"/>
        <text class="legend-label" x="40" y="808">LEGEND</text>
        <line class="legend-line" x1="128" y1="804" x2="176" y2="804" marker-end="url(#dspl-arrow)"/>
        <text class="legend-label" x="188" y="808">PRIMARY FLOW</text>
        <line class="legend-line secondary" x1="352" y1="804" x2="400" y2="804" marker-end="url(#dspl-arrow-secondary)"/>
        <text class="legend-label" x="412" y="808">SECONDARY / RUNTIME</text>
        <rect class="legend-focal" x="624" y="796" width="16" height="16" rx="4"/>
        <text class="legend-label" x="652" y="808">FOCAL BUILD OR DECISION NODE</text>
        </g>
      </svg>
    </div>
  </main>
</body>
</html>
